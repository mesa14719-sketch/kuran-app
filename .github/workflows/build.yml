name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html www/ || true
          cp style.css www/ || true
          cp script.js www/ || true

      - name: Prepare icon from images.jpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          mkdir -p assets
          convert images.jpeg -resize 1024x1024^ -background '#0f0c29' -gravity center -extent 1024x1024 assets/icon.png
          echo "✅ icon.png ready:"
          file assets/icon.png

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor
        run: |
          npx cap init "القرآن الكريم" com.maker.quran --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Generate Icons
        run: |
          npm install @capacitor/assets
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#0f0c29' \
            --iconBackgroundColorDark '#0f0c29'

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
