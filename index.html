<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشغّل أكواد HTML - أصفر وأسود</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

  /* ====== خلفية سوداء ====== */
  body {
    margin: 0;
    min-height: 100vh;
    background: #000000;
    color: #ffff00;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  /* ====== البطاقة ====== */
  .card {
    background: #0a0a0a;
    border: 3px solid #ffff00;
    border-radius: 20px;
    padding: 30px;
    width: 100%;
    max-width: 800px;
    box-shadow:
      0 0 40px rgba(255, 255, 0, 0.35),
      0 20px 60px rgba(0, 0, 0, 0.9),
      inset 0 0 30px rgba(255, 255, 0, 0.05);
    position: relative;
  }

  /* ====== العنوان ====== */
  .title {
    text-align: center;
    margin-bottom: 25px;
  }
  .title h1 {
    margin: 0 0 8px;
    font-size: 28px;
    color: #ffff00;
    font-weight: 900;
    letter-spacing: 1px;
    text-shadow: 0 0 20px rgba(255, 255, 0, 0.6), 0 0 40px rgba(255, 255, 0, 0.3);
  }
  .title p {
    margin: 0;
    color: #cccc00;
    font-size: 13px;
  }

  /* ====== حقل الإدخال ====== */
  .input-wrapper {
    margin-bottom: 20px;
  }
  .input-label {
    display: block;
    color: #ffff00;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  textarea {
    width: 100%;
    min-height: 280px;
    background: #000000;
    color: #ffff00;
    border: 2px solid #666600;
    border-radius: 12px;
    padding: 16px;
    font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
    font-size: 14px;
    line-height: 1.7;
    resize: vertical;
    outline: none;
    transition: all 0.3s;
    tab-size: 2;
    caret-color: #ffff00;
  }
  textarea::placeholder {
    color: #555500;
  }
  textarea:focus {
    border-color: #ffff00;
    box-shadow: 0 0 0 4px rgba(255, 255, 0, 0.2), 0 0 25px rgba(255, 255, 0, 0.3);
  }

  /* ====== زر التشغيل ====== */
  .run-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 900;
    cursor: pointer;
    background: #ffff00;
    color: #000000;
    letter-spacing: 1px;
    box-shadow:
      0 6px 0 #999900,
      0 10px 25px rgba(255, 255, 0, 0.4);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .run-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 0 #999900, 0 14px 30px rgba(255, 255, 0, 0.6);
    background: #ffff33;
  }
  .run-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #999900, 0 4px 10px rgba(255, 255, 0, 0.3);
  }

  /* ====== نافذة المشغّل ====== */
  #runnerModal {
    display: none;
    position: fixed;
    inset: 0;
    background: #000000;
    z-index: 1000;
    flex-direction: column;
  }
  #runnerModal.active {
    display: flex;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.98); }
    to { opacity: 1; transform: scale(1); }
  }

  /* شريط علوي */
  .modal-bar {
    background: #0a0a0a;
    border-bottom: 3px solid #ffff00;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    box-shadow: 0 2px 15px rgba(255, 255, 0, 0.2);
  }
  .modal-bar-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .modal-title {
    color: #ffff00;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .modal-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  /* أزرار النافذة */
  .btn {
    padding: 9px 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-back {
    background: #ffff00;
    color: #000000;
    box-shadow: 0 3px 0 #999900;
  }
  .btn-back:hover {
    background: #ffff33;
    transform: translateY(-1px);
    box-shadow: 0 4px 0 #999900;
  }
  .btn-back:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #999900;
  }
  .btn-ghost {
    background: transparent;
    color: #ffff00;
    border: 2px solid #ffff00;
  }
  .btn-ghost:hover {
    background: #ffff00;
    color: #000000;
  }

  /* إطار المعاينة */
  .iframe-wrapper {
    flex: 1;
    position: relative;
    background: #fff;
    overflow: hidden;
  }
  #previewFrame {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: #fff;
  }

  /* شارة الحالة */
  .status-badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    background: rgba(255, 255, 0, 0.15);
    color: #ffff00;
    border: 1px solid rgba(255, 255, 0, 0.4);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .status-badge .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #ffff00;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* تلميحات */
  .hint {
    text-align: center;
    color: #999900;
    font-size: 12px;
    margin-top: 15px;
  }
  .hint kbd {
    background: #1a1a00;
    border: 1px solid #ffff00;
    color: #ffff00;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 11px;
    font-family: monospace;
  }

  /* استجابة الجوال */
  @media (max-width: 600px) {
    .card { padding: 22px 18px; border-radius: 16px; }
    .title h1 { font-size: 22px; }
    textarea { min-height: 220px; font-size: 13px; }
    .run-btn { font-size: 16px; padding: 14px; }
    .modal-title { display: none; }
    .btn { padding: 8px 12px; font-size: 12px; }
  }
</style>
</head>
<body>

<!-- ============ الواجهة الرئيسية ============ -->
<div class="card">
  <div class="title">
    <h1>⚡ مشغّل أكواد HTML ⚡</h1>
    <p>الصق كود HTML في الحقل بالأسفل ثم اضغط "تشغيل"</p>
  </div>

  <div class="input-wrapper">
    <label class="input-label">
      <span>📝</span> كود HTML
    </label>
    <textarea id="codeInput" spellcheck="false" placeholder="<!DOCTYPE html>
<html>
  <body style="background:#000;color:#ff0;font-family:sans-serif;text-align:center;padding:50px;">
    <h1>مرحباً بالعالم!</h1>
    <p>هذا كود HTML تجريبي</p>
  </body>
</html>"></textarea>
  </div>

  <button class="run-btn" onclick="runCode()">
    <span>▶</span>
    <span>تشغيل الكود</span>
  </button>

  <p class="hint">
    💡 اضغط <kbd>Ctrl</kbd> + <kbd>Enter</kbd> للتشغيل السريع
  </p>
</div>

<!-- ============ نافذة المشغّل ============ -->
<div id="runnerModal">
  <div class="modal-bar">
    <div class="modal-bar-left">
      <button class="btn btn-back" onclick="goBack()">
        <span>⬅</span> رجوع
      </button>
      <span class="modal-title">🖥️ نتيجة الكود</span>
    </div>
    <div class="modal-actions">
      <span class="status-badge">
        <span class="dot"></span> مباشر
      </span>
      <button class="btn btn-ghost" onclick="openInNewTab()">
        ↗ نافذة جديدة
      </button>
    </div>
  </div>

  <div class="iframe-wrapper">
    <iframe id="previewFrame"
            sandbox="allow-scripts allow-modals allow-forms allow-same-origin allow-popups">
    </iframe>
  </div>
</div>

<script>
  const codeInput = document.getElementById('codeInput');
  const runnerModal = document.getElementById('runnerModal');
  const previewFrame = document.getElementById('previewFrame');

  // ============ تشغيل الكود ============
  function runCode() {
    const code = codeInput.value.trim();

    if (!code) {
      shakeInput();
      return;
    }

    runnerModal.classList.add('active');

    try {
      const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
      doc.open();
      doc.write(code);
      doc.close();
    } catch (err) {
      const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
      doc.open();
      doc.write(`
        <body style="font-family:sans-serif;padding:40px;background:#000;color:#ff0;">
          <h2>⚠️ خطأ</h2>
          <pre style="color:#f66;">${escapeHtml(err.message)}</pre>
        </body>
      `);
      doc.close();
    }
  }

  // ============ زر الرجوع ============
  function goBack() {
    runnerModal.classList.remove('active');
    setTimeout(() => {
      const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
      doc.open();
      doc.write('');
      doc.close();
    }, 300);
    codeInput.focus();
  }

  // ============ نافذة جديدة ============
  function openInNewTab() {
    const code = codeInput.value.trim();
    if (!code) return;
    const blob = new Blob([code], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // ============ اهتزاز عند حقل فارغ ============
  function shakeInput() {
    codeInput.style.borderColor = '#ff0000';
    codeInput.style.boxShadow = '0 0 0 4px rgba(255,0,0,0.3)';
    codeInput.style.transform = 'translateX(-8px)';
    setTimeout(() => codeInput.style.transform = 'translateX(8px)', 80);
    setTimeout(() => codeInput.style.transform = 'translateX(-5px)', 160);
    setTimeout(() => codeInput.style.transform = 'translateX(5px)', 240);
    setTimeout(() => {
      codeInput.style.transform = '';
      codeInput.style.borderColor = '';
      codeInput.style.boxShadow = '';
    }, 400);
    codeInput.focus();
  }

  // ============ اختصارات ============
  codeInput.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'Enter') {
      e.preventDefault();
      runCode();
    }
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = codeInput.selectionStart;
      const en = codeInput.selectionEnd;
      codeInput.value = codeInput.value.substring(0, s) + '  ' + codeInput.value.substring(en);
      codeInput.selectionStart = codeInput.selectionEnd = s + 2;
    }
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && runnerModal.classList.contains('active')) {
      goBack();
    }
  });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&', '<': '<', '>': '>', '"': '"', "'": '''
    }[c]));
  }
</script>
</body>
</html>
